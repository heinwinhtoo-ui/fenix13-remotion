<!doctype html><html><body><template>
<style>
#v3-world{position:absolute;inset:0;width:100%;height:100%;background:var(--ink)}
#v3-world-bed{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 60%,rgba(168,67,32,.13),transparent 60%),radial-gradient(ellipse at 87% 25%,rgba(128,84,232,.065),transparent 50%)}
#v3-world-canvas{width:100%;height:100%;display:block;position:absolute;inset:0}
#v3-world-floor{position:absolute;left:120px;right:120px;top:1200px;height:380px;opacity:0;background:radial-gradient(ellipse at center,rgba(255,107,32,.08),transparent 65%)}
</style>
<div id="v3-world" data-composition-id="v3-world" data-width="1080" data-height="1920" data-duration="20">
<div id="v3-world-bed"></div><div id="v3-world-floor"></div><canvas id="v3-world-canvas" width="1080" height="1920" aria-label="Original FENIX /13 beveled three-dimensional wordmark and copper light arc"></canvas>
</div>
<script>(()=>{const stage=window.FENIX_STUDIO.createStage(document.getElementById('v3-world-canvas'));const clock={time:0};
const tl=gsap.timeline({paused:true});tl.to(clock,{time:20,duration:20,ease:'none',onUpdate:()=>stage.update(clock.time)},0);
tl.fromTo('#v3-world-bed',{opacity:0},{opacity:1,duration:1.4,ease:'sine.out'},.15);
tl.fromTo('#v3-world-floor',{opacity:0},{opacity:1,duration:1.3,ease:'power2.out'},16.5);
window.__timelines['v3-world']=tl;})();</script>
</template></body></html>
