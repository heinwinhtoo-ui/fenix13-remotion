<!doctype html><html><body><template>
<style>
#v3-fire{position:absolute;inset:0;width:100%;height:100%;perspective:1600px}
#v3-fire .scene-content{gap:12px}
#v3-fire-build{transform-style:preserve-3d;position:relative}
#v3-fire-head{display:flex;font-size:380px;line-height:1.05;letter-spacing:-.025em;white-space:nowrap}
#v3-fire-head .glyph{transform-origin:center bottom;transform-style:preserve-3d;text-shadow:3px 6px 0 var(--copper)}
#v3-fire-bridge{font-size:156px;letter-spacing:.05em;margin:12px 0}
#v3-fire-grill{font-size:305px;letter-spacing:-.03em;color:var(--orange);white-space:nowrap;transform-style:preserve-3d}
#v3-fire-grill .glyph{transform-origin:center}
#v3-fire-label{margin-bottom:70px}
#v3-fire-heat{display:flex;gap:14px;margin-top:42px;height:6px}
#v3-fire-heat i{background:var(--orange);flex:1;transform-origin:left}
</style>
<div id="v3-fire" data-composition-id="v3-fire" data-width="1080" data-height="1920" data-duration="3">
<div class="scene-content">
<div id="v3-fire-label" class="stage-label mono">FEEL THE HEAT</div>
<div id="v3-fire-build"><div id="v3-fire-head" class="type">FIRE</div>
<div class="mask"><div id="v3-fire-bridge" class="type">UP THE</div></div>
<div id="v3-fire-grill" class="type">GRILL.</div></div>
<div id="v3-fire-heat" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</div></div>
<script>(()=>{for(const id of ['v3-fire-head','v3-fire-grill']){const el=document.getElementById(id);el.innerHTML=[...el.textContent].map(c=>'<span class="glyph">'+c+'</span>').join('');}
const tl=gsap.timeline({paused:true});
tl.fromTo('#v3-fire-head .glyph',{rotationX:-105,y:30,z:120,opacity:0},{rotationX:0,y:0,z:0,opacity:1,duration:.75,stagger:.085,ease:'power4.out'},.08);
tl.fromTo('#v3-fire-bridge',{y:230,skewX:-12},{y:0,skewX:0,duration:.57,ease:'expo.out'},.43);
tl.fromTo('#v3-fire-grill .glyph',{rotationY:85,z:320,x:70,opacity:0},{rotationY:0,z:0,x:0,opacity:1,duration:.78,stagger:{each:.045,from:'end'},ease:'circ.out'},.58);
tl.fromTo('#v3-fire-label',{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:'power2.out'},.8);
tl.fromTo('#v3-fire-heat i',{scaleX:0},{scaleX:1,duration:.5,stagger:.1,ease:'power3.out'},1.3);
tl.to('#v3-fire-build',{rotationY:-5,rotationX:3,z:22,duration:1.2,ease:'sine.inOut'},1.65);
window.__timelines['v3-fire']=tl;})();</script>
</template></body></html>
