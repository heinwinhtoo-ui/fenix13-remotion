<!doctype html><html><body><template>
<style>
#v3-social{position:absolute;inset:0;width:100%;height:100%;perspective:1600px}
#v3-social .scene-content{gap:43px;padding-top:290px;padding-bottom:290px}
.v3-social-unit{transform-style:preserve-3d;position:relative}
.v3-social-prefix{font-size:34px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px}
.v3-social-word{font-size:218px;white-space:nowrap;line-height:1.1}
#v3-social-2{text-align:right;transform-origin:right center}
#v3-social-3 .v3-social-word{font-size:235px;color:var(--orange)}
</style>
<div id="v3-social" data-composition-id="v3-social" data-width="1080" data-height="1920" data-duration="3">
<div class="scene-content">
<div id="v3-social-1" class="v3-social-unit"><div class="v3-social-prefix mono">GOOD</div><div class="v3-social-word type">FOOD.</div></div>
<div id="v3-social-2" class="v3-social-unit"><div class="v3-social-prefix mono">GOOD</div><div class="v3-social-word type">VIBES.</div></div>
<div id="v3-social-3" class="v3-social-unit"><div class="v3-social-prefix mono">GREAT</div><div class="v3-social-word type">NIGHTS.</div></div>
</div></div>
<script>(()=>{const tl=gsap.timeline({paused:true});
tl.fromTo('#v3-social-1',{rotationY:-75,rotationZ:-10,x:-280,opacity:0},{rotationY:0,rotationZ:0,x:0,opacity:1,duration:.8,ease:'expo.out'},.08);
tl.fromTo('#v3-social-2',{rotationY:75,rotationZ:10,x:280,opacity:0},{rotationY:0,rotationZ:0,x:0,opacity:1,duration:.8,ease:'power4.out'},.67);
tl.fromTo('#v3-social-3',{rotationX:-75,z:400,scale:.65,opacity:0},{rotationX:0,z:0,scale:1,opacity:1,duration:.85,ease:'circ.out'},1.26);
window.__timelines['v3-social']=tl;})();</script>
</template></body></html>
