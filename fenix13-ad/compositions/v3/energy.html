<!doctype html><html><body><template>
<style>
#v3-energy{position:absolute;inset:0;width:100%;height:100%}
#v3-energy .scene-content{gap:90px}
#v3-drum-frame{position:relative;width:844px;height:340px;perspective:1700px;perspective-origin:center;overflow:hidden}
#v3-drum{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.v3-drum-plane{position:absolute;inset:0;display:flex;align-items:center;backface-visibility:hidden;transform-style:preserve-3d;font-size:280px;white-space:nowrap}
#v3-drum-smoke{transform:rotateX(0deg) translateZ(450px)}
#v3-drum-spark{transform:rotateX(120deg) translateZ(450px);color:var(--orange)}
#v3-drum-energy{transform:rotateX(240deg) translateZ(450px);font-size:250px}
#v3-drum-count{display:flex;gap:18px;margin-top:50px}
#v3-drum-count i{width:80px;height:4px;background:var(--copper);transform-origin:left}
#v3-energy-label{color:var(--muted);font-size:29px;letter-spacing:.2em}
</style>
<div id="v3-energy" data-composition-id="v3-energy" data-width="1080" data-height="1920" data-duration="3">
<div class="scene-content"><div id="v3-energy-label" class="mono">THE NIGHT HAS A PULSE</div>
<div id="v3-drum-frame" data-layout-allow-overlap><div id="v3-drum">
<div id="v3-drum-smoke" class="v3-drum-plane type">SMOKE.</div><div id="v3-drum-spark" class="v3-drum-plane type">SPARK.</div><div id="v3-drum-energy" class="v3-drum-plane type">ENERGY.</div>
</div></div><div id="v3-drum-count" aria-hidden="true"><i></i><i></i><i></i></div></div>
</div>
<script>(()=>{const tl=gsap.timeline({paused:true});
tl.fromTo('#v3-drum',{z:-450,rotationX:20},{z:-450,rotationX:0,duration:.5,ease:'power4.out'},.06);
tl.fromTo('#v3-drum-frame',{opacity:0,scale:.9},{opacity:1,scale:1,duration:.4,ease:'circ.out'},.06);
tl.to('#v3-drum',{rotationX:-120,duration:.5,ease:'power3.inOut'},1);
tl.to('#v3-drum',{rotationX:-240,duration:.5,ease:'power3.inOut'},2);
tl.fromTo('#v3-energy-label',{opacity:0},{opacity:1,duration:.4,ease:'power2.out'},.24);
gsap.utils.toArray('#v3-drum-count i').forEach((el,i)=>{tl.fromTo(el,{scaleX:.15,backgroundColor:'#a84320'},{scaleX:1,backgroundColor:'#ff6b20',duration:.45,ease:'expo.out'},i);});
window.__timelines['v3-energy']=tl;})();</script>
</template></body></html>
